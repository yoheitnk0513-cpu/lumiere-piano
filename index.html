<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumière 音楽教室</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Serif+JP:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FBF4F6;
      font-family: 'Noto Serif JP', serif;
    }
    .container {
      text-align: center;
      padding: 60px 40px;
    }
    .logo-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.8rem;
      font-weight: 300;
      color: #9B5A6E;
      letter-spacing: 0.15em;
      margin-bottom: 8px;
    }
    .logo-sub {
      font-size: 0.9rem;
      color: #C47A8A;
      letter-spacing: 0.3em;
      margin-bottom: 48px;
    }
    .divider {
      width: 60px;
      height: 1px;
      background: #E8A0B4;
      margin: 0 auto 48px;
    }
    .message {
      font-size: 1rem;
      color: #7a5a65;
      letter-spacing: 0.2em;
      line-height: 2;
    }
    .message-en {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.1rem;
      color: #C47A8A;
      letter-spacing: 0.1em;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-text">Lumière</div>
    <div class="logo-sub">音楽教室</div>
    <div class="divider"></div>
    <div class="message">ただいまサイトを準備中です。<br>もうしばらくお待ちください。</div>
    <div class="message-en">Coming Soon</div>
  </div>
</body>
</html>
